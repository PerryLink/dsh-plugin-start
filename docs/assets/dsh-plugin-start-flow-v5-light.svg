<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-label="dsh-plugin-start hopper: a dsh-start argv bar feeds an admission gate ladder (argv, package name, target directory) that narrows into one write step; the mouth forks into two lanes — the six files always written and the --client delta of client.js plus three package.json rewrites — and both lanes converge on one receipt rail. Each of the first three gates can reject with its own message and exit 1.">
<title>dsh-plugin-start — admission hopper and template confluence</title>
<defs>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="200%">
    <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#241d4a" flood-opacity="0.10"/>
  </filter>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="1.3" cy="1.3" r="1.3" fill="#ece7f7"/>
  </pattern>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#4B67B4"/>
  </marker>
  <marker id="arrFaint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#8f94a4"/>
  </marker>
  <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f9f6fd"/>
    <stop offset="1" stop-color="#e4eaf8"/>
  </linearGradient>
</defs>
<rect width="1100" height="660" fill="url(#page)"/>
<rect width="1100" height="660" fill="url(#dots)" opacity=".6"/>

<text x="44" y="48" fill="#141419" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="700" >dsh-plugin-start</text>
<text x="44" y="76" fill="#4d5261" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" >new &lt;name&gt; → 三道准入闸 → 基础 6 件 ∪ --client 增量 → 一张回执 · 统一 exit 0 / 1</text>
<text x="1056" y="46" fill="#8f94a4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="end" >src/start.js · create(name, target, {client})</text>
<text x="1056" y="66" fill="#8f94a4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="end" >bin/dsh-start.js → main(argv)</text>
